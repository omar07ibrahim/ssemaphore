  <title id="title">SSEmaphore fixed-seed dispatch trace</title>
  <desc id="desc">Twenty observed weighted deficit round-robin dispatches plotted by estimated work units and tenant, with independent oracle points coincident at every position. Two SSE requests are outlined.</desc>
