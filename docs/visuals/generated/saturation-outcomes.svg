<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SSEmaphore exact saturation outcomes</title>
  <desc id="desc">A stacked request-count outcome chart with exact per-tenant accounting and zero-upstream tenant and global capacity probes from one fixed-seed run.</desc>
  <rect width="1200" height="650" rx="18" fill="#f6f8fa"/>
  <text x="54" y="55" fill="#24292f" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">Exact request-count outcomes from one bounded run</text>
  <text x="54" y="84" fill="#57606a" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">26 service submissions plus one control and one dedicated global-capacity probe; fixed seed 20260725.</text>

  <text x="80" y="137" fill="#24292f" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">service submissions = 26</text>
  <rect x="80" y="158" width="800" height="58" rx="9" fill="#2da44e"/>
  <rect x="880" y="158" width="80" height="58" fill="#bf8700"/>
  <rect x="960" y="158" width="80" height="58" fill="#8250df"/>
  <rect x="1040" y="158" width="80" height="58" rx="9" fill="#cf222e"/>
  <text x="480" y="194" text-anchor="middle" fill="#0d1117" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700">20 completed</text>
  <text x="920" y="194" text-anchor="middle" fill="#0d1117" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">2 cancel</text>
  <text x="1000" y="194" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">2 deadline</text>
  <text x="1080" y="194" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700">2 reject</text>

  <rect x="54" y="270" width="336" height="244" rx="16" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="82" y="310" fill="#0550ae" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">tenant-a - weight 1</text>
  <text x="82" y="348" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">submitted             13</text>
  <text x="82" y="378" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">admitted              12</text>
  <text x="82" y="408" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">complete/cancel/dead  10 / 1 / 1</text>
  <text x="82" y="438" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">rejected              1</text>
  <text x="82" y="468" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">dispatches/work units 10 / 1388</text>

  <rect x="432" y="270" width="336" height="244" rx="16" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="460" y="310" fill="#6639ba" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">tenant-b - weight 3</text>
  <text x="460" y="348" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">submitted             13</text>
  <text x="460" y="378" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">admitted              12</text>
  <text x="460" y="408" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">complete/cancel/dead  10 / 1 / 1</text>
  <text x="460" y="438" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">rejected              1</text>
  <text x="460" y="468" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">dispatches/work units 10 / 1331</text>

  <rect x="810" y="270" width="336" height="244" rx="16" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="838" y="310" fill="#24292f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Boundary probes and control</text>
  <text x="838" y="350" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">tenant capacity  2 x 429</text>
  <text x="838" y="380" fill="#57606a" font-family="DejaVu Sans Mono, monospace" font-size="15">upstream requests      0</text>
  <text x="838" y="420" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">global capacity  1 x 503</text>
  <text x="838" y="450" fill="#57606a" font-family="DejaVu Sans Mono, monospace" font-size="15">upstream requests      0</text>
  <text x="838" y="490" fill="#24292f" font-family="DejaVu Sans Mono, monospace" font-size="16">control complete/upstream 1 / 1</text>

  <rect x="54" y="550" width="1092" height="58" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="600" y="585" text-anchor="middle" fill="#633c01" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">Request-count accounting only - not throughput, latency, RSS, fairness score, or service-share evidence.</text>
</svg>
